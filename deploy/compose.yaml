name: agent-meeting-platform

x-app-security: &app-security
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - app

x-app-environment: &app-environment
  NODE_ENV: production
  API_BIND_HOST: 0.0.0.0
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: council
  PGUSER: council
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL: redis://redis:6379
  APP_MASTER_KEY_FILE: /run/secrets/app_master_key
  MCP_LOCAL_HOST_ALLOWLIST: ${MCP_LOCAL_HOST_ALLOWLIST:?MCP_LOCAL_HOST_ALLOWLIST is required}
  MCP_ARGUMENT_ENCRYPTION_WRITE_ENABLED: ${MCP_ARGUMENT_ENCRYPTION_WRITE_ENABLED:-true}
  MCP_KEYED_FINGERPRINT_WRITE_ENABLED: ${MCP_KEYED_FINGERPRINT_WRITE_ENABLED:-true}
  MCP_LEGACY_ARGUMENT_READER_ENABLED: ${MCP_LEGACY_ARGUMENT_READER_ENABLED:-true}
  GOAL_RUN_AUTONOMY_ENABLED: ${GOAL_RUN_AUTONOMY_ENABLED:-false}
  OMP_RUNTIME_ENABLED: ${OMP_RUNTIME_ENABLED:-false}
  OMP_HOST_TOOLS_ENABLED: ${OMP_HOST_TOOLS_ENABLED:-false}
  OMP_SUBAGENTS_ENABLED: ${OMP_SUBAGENTS_ENABLED:-false}
  OMP_SANDBOX_PROFILE_ID: ${OMP_SANDBOX_PROFILE_ID:-}
  OMP_SANDBOX_IMAGE_DIGEST: ${OMP_RUNTIME_IMAGE_DIGEST:-}
  OMP_WORKSPACE_SOURCE_ID: ${OMP_WORKSPACE_SOURCE_ID:-}
  OMP_WORKSPACE_ARCHIVE_DIGEST: ${OMP_WORKSPACE_ARCHIVE_DIGEST:-}
  TEST_LOGIN_ENABLED: "false"
  HARNESS_ACTION_ADAPTER_ENABLED: ${HARNESS_ACTION_ADAPTER_ENABLED:-false}
  HARNESS_ACTION_ADAPTER_ENDPOINT_ALLOWLIST: ${HARNESS_ACTION_ADAPTER_ENDPOINT_ALLOWLIST:-}

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: council
      POSTGRES_USER: council
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U council -d council"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/redis:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    <<: *app-security
    profiles: ["ops"]
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-api:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: api
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    restart: "no"
    command: ["node", "node_modules/@council/database/dist/migrate.js"]
    environment: *app-environment
    secrets:
      - postgres_password
      - app_master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  sync-legacy-projections:
    <<: *app-security
    profiles: ["ops"]
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-api:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: api
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    restart: "no"
    command: ["node", "node_modules/@council/database/dist/sync-legacy-projections.js"]
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: council
      PGUSER: council
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGPOOL_MAX: "1"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  api:
    <<: *app-security
    stop_grace_period: 15s
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-api:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: api
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    environment:
      <<: *app-environment
      PORT: "4000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      AUTH_DISABLED: ${AUTH_DISABLED:?AUTH_DISABLED is required}
      ALLOW_PRODUCTION_AUTH_BYPASS: ${ALLOW_PRODUCTION_AUTH_BYPASS:?ALLOW_PRODUCTION_AUTH_BYPASS is required}
      TAILNET_QUICK_LOGIN_ENABLED: ${TAILNET_QUICK_LOGIN_ENABLED:?TAILNET_QUICK_LOGIN_ENABLED is required}
      TAILNET_QUICK_LOGIN_IDENTITY: ${TAILNET_QUICK_LOGIN_IDENTITY:-}
      TAILNET_QUICK_LOGIN_OWNER_EMAIL: ${TAILNET_QUICK_LOGIN_OWNER_EMAIL:-}
      HARNESS_EXECUTOR_ENABLED: "false"
      PGPOOL_MAX: "10"
    secrets:
      - postgres_password
      - app_master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app-security
    stop_grace_period: 35s
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-worker:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: worker
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
        WORKER_NODE_IMAGE: node:24.14.0-trixie-slim@sha256:8c8f12cedb96c3b59642cf30d713943c2b223990c9919b96a141681f62e6e292
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: "2"
      HEALTH_PORT: "4102"
      PGPOOL_MAX: "5"
      CODEX_CLI_HARNESS_ENABLED: "false"
      GOVERNANCE_PROVIDER: ${GOVERNANCE_PROVIDER:-native}
      GOVERNANCE_MODE: ${GOVERNANCE_MODE:-off}
      GOVERNANCE_TIMEOUT_MS: ${GOVERNANCE_TIMEOUT_MS:-2000}
      ACS_OPA_TIMEOUT_MS: ${GOVERNANCE_TIMEOUT_MS:-2000}
      GOVERNANCE_ACS_MANIFEST_PATH: ${GOVERNANCE_ACS_MANIFEST_PATH:-/etc/council/governance/acs-mcp-readonly.manifest.yaml}
      GOVERNANCE_ACS_POLICY_ARTIFACT_PATHS: ${GOVERNANCE_ACS_POLICY_ARTIFACT_PATHS:-/etc/council/governance/policy}
      GOVERNANCE_ACS_EXPECTED_POLICY_DIGEST: ${GOVERNANCE_ACS_EXPECTED_POLICY_DIGEST:-}
      OMP_BROKER_URL: http://sandbox-broker:8080
      OMP_BROKER_TOKEN_FILE: /run/secrets/sandbox_broker_token
    secrets:
      - postgres_password
      - app_master_key
      - sandbox_broker_token
    networks:
      app:
      execution:
        ipv4_address: 10.213.44.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sandbox-broker:
    <<: *app-security
    profiles: ["omp"]
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-sandbox-broker:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: sandbox-broker
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
        DOCKER_CLI_IMAGE: docker:29.7.2-cli@sha256:eb952fbf036947347bff9f303878c86ec3df00af0341f4cca59b1d1924d6668d
    environment:
      NODE_ENV: production
      SANDBOX_BROKER_BIND_HOST: 0.0.0.0
      SANDBOX_BROKER_PORT: "8080"
      SANDBOX_BROKER_TOKEN_FILE: /run/secrets/sandbox_broker_token
      SANDBOX_BROKER_WORKSPACE_ROOT: /var/lib/council/sandbox-workspaces
      SANDBOX_BROKER_ALLOWED_SOURCE_ADDRESSES: 10.213.44.2,::ffff:10.213.44.2
      SANDBOX_BROKER_EXECUTION_ISOLATION_ATTESTATION_FILE: /etc/council/omp-isolation/attestation.json
      SANDBOX_BROKER_IMAGE_DIGEST: ${OMP_BROKER_IMAGE_DIGEST:-}
      OMP_RUNTIME_ENABLED: ${OMP_RUNTIME_ENABLED:-false}
      OMP_HOST_TOOLS_ENABLED: ${OMP_HOST_TOOLS_ENABLED:-false}
      OMP_SUBAGENTS_ENABLED: ${OMP_SUBAGENTS_ENABLED:-false}
      OMP_ROOTLESS_DOCKER_HOST: unix:///run/user/${APP_UID:?APP_UID is required}/docker.sock
      OMP_RUNTIME_IMAGE_REFERENCE: ${OMP_RUNTIME_IMAGE_DIGEST:-}
      OMP_RUNTIME_IMAGE_DIGEST: ${OMP_RUNTIME_IMAGE_DIGEST:-}
      OMP_INTERNAL_NETWORK: council-omp-internal
      OMP_MODEL_GATEWAY_CONTAINER: council-omp-model-gateway
      OMP_MODEL_BASE_URL: http://council-omp-model-gateway:4001/v1
      OMP_BROKER_DATA_ROOT: /var/lib/council/omp-broker
      OMP_SOURCE_ROOT: /var/lib/council/omp-sources
      OMP_MAX_CONCURRENCY: "1"
      OMP_CPU_LIMIT: "2"
      OMP_MEMORY_MB: "8192"
      OMP_PROCESS_LIMIT: "256"
      OMP_DISK_MB: "8192"
      OMP_VERIFICATION_COMMAND_JSON: '["node","--test"]'
    secrets:
      - sandbox_broker_token
    volumes:
      - /run/user/${APP_UID:?APP_UID is required}/docker.sock:/run/user/${APP_UID:?APP_UID is required}/docker.sock
      - ${DATA_ROOT:?DATA_ROOT is required}/sandbox-workspaces:/var/lib/council/sandbox-workspaces
      - ${DATA_ROOT:?DATA_ROOT is required}/omp-broker:/var/lib/council/omp-broker
      - ${DATA_ROOT:?DATA_ROOT is required}/omp-sources:/var/lib/council/omp-sources:ro
      - ${DATA_ROOT:?DATA_ROOT is required}/omp-isolation:/etc/council/omp-isolation:ro
    networks:
      execution:
        ipv4_address: 10.213.44.3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/omp-runtime').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mcp-readonly:
    <<: *app-security
    image: agent-meeting-platform-mcp-readonly:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: mcp-readonly
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    environment:
      NODE_ENV: production
      PORT: "4100"
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  task-adapter-reference:
    <<: *app-security
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-task-adapter-reference:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: task-adapter-reference
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4200"
      TASK_ADAPTER_TOKEN_FILE: /run/secrets/task_adapter_token
    secrets:
      - task_adapter_token
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const token=fs.readFileSync('/run/secrets/task_adapter_token','utf8').trim();fetch('http://127.0.0.1:4200/health',{headers:{authorization:'Bearer '+token}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  model-tunnel:
    <<: *app-security
    profiles: ["model-tunnel"]
    networks:
      app:
        aliases:
          - council-omp-model-gateway
    user: "${APP_UID:?APP_UID is required}:${APP_GID:?APP_GID is required}"
    image: agent-meeting-platform-model-tunnel:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: model-tunnel
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    secrets:
      - model_tunnel_key
      - model_tunnel_known_hosts
    environment:
      SSH_HOST: ${MODEL_TUNNEL_SSH_HOST:-}
      SSH_PORT: ${MODEL_TUNNEL_SSH_PORT:-22}
      SSH_USER: ${MODEL_TUNNEL_SSH_USER:-}
      SSH_KEY_FILE: /run/secrets/model_tunnel_key
      KNOWN_HOSTS_FILE: /run/secrets/model_tunnel_known_hosts
      TARGET_HOST: ${MODEL_TUNNEL_TARGET_HOST:-127.0.0.1}
      TARGET_PORT: ${MODEL_TUNNEL_TARGET_PORT:-4001}
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: "4001"
      HEALTH_HOST: 127.0.0.1
      HEALTH_PORT: "4101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    <<: *app-security
    image: agent-meeting-platform-web:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ${RELEASE_ROOT:?RELEASE_ROOT is required}
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NODE_IMAGE: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
        NEXT_PUBLIC_GOAL_RUN_AUTONOMY_ENABLED: ${GOAL_RUN_AUTONOMY_ENABLED:-false}
        NEXT_PUBLIC_TEST_LOGIN_ENABLED: "false"
        NEXT_PUBLIC_TAILNET_QUICK_LOGIN_ENABLED: ${TAILNET_QUICK_LOGIN_ENABLED:?TAILNET_QUICK_LOGIN_ENABLED is required}
        NEXT_PUBLIC_OMP_RUNTIME_ENABLED: ${OMP_RUNTIME_ENABLED:-false}
        NEXT_PUBLIC_SOURCE_URL: ${COUNCIL_SOURCE_URL:-}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COUNCIL_PORT:-8787}:8080"
    volumes:
      - ${RELEASE_ROOT:?RELEASE_ROOT is required}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:?DATA_ROOT is required}/caddy-data:/data
      - ${DATA_ROOT:?DATA_ROOT is required}/caddy-config:/config
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  app:
    name: agent-meeting-platform-app
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  execution:
    name: agent-meeting-platform-execution
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config:
        - subnet: 10.213.44.0/29

secrets:
  postgres_password:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/postgres_password
  app_master_key:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/app_master_key
  model_tunnel_key:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/model_tunnel_key
  model_tunnel_known_hosts:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/model_tunnel_known_hosts
  task_adapter_token:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/task_adapter_token
  sandbox_broker_token:
    file: ${SECRETS_ROOT:?SECRETS_ROOT is required}/sandbox_broker_token
